# nginx untuk Kolam Prima (Laravel 13, PHP 8.3)
# Ditempatkan ke /etc/nginx/sites-available/kolam-prima.conf
#
# Setelah domain kustom siap, jalankan:
#   sudo certbot --nginx -d domain-anda.com -d www.domain-anda.com
# Certbot akan menambahkan blok 443 + redirect HTTP->HTTPS secara otomatis.

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/kolam-prima/public;
    index index.php;

    charset utf-8;

    # Ukuran unggahan gambar/video lewat panel admin.
    client_max_body_size 64M;

    access_log /var/log/nginx/kolam-prima.access.log;
    error_log  /var/log/nginx/kolam-prima.error.log;

    # Laravel front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # Blokir akses ke file tersembunyi.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
