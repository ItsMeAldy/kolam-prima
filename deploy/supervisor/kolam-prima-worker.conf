; Supervisor untuk Laravel queue worker — Kolam Prima
; Ditempatkan ke /etc/supervisor/conf.d/kolam-prima-worker.conf

[program:kolam-prima-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/kolam-prima/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/kolam-prima/storage/logs/worker.log
stopwaitsecs=3600
